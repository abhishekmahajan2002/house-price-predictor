name: MLops Pipeline

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: true
        default: 'true'
      run_data_processing:
        description: 'Run data processing job'
        required: true
        default: 'true'
      run_model_training:
        description: 'Run model training job'
        required: true
        default: 'true'
      run_build_and_publish:
        description: 'Run build and publish Docker image job'
        required: true
        default: 'true'
jobs:
    data-processing:
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v3
        -   name: Setup Python
            uses: actions/setup-python@v4
            with:
                python-version: '3.11.15'
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
        -   name: Run data processing
            run: |
                python src/data/run_processing.py --input data/raw/house_data.csv --output data/processed/cleaned_house_data.csv
        -   name: Do feature engineering
            run: |
                python src/features/engineer.py --input data/processed/cleaned_house_data.csv --output data/processed/featured_house_data.csv --preprocessor models/trained/preprocessor.pkl
        -   name: Save processed data
            uses: actions/upload-artifact@v4
            with:
                name: processed-data
                path: data/processed/featured_house_data.csv
        -   name: Upload preprocessor
            uses: actions/upload-artifact@v4
            with:
                name: preprocessor
                path: models/trained/preprocessor.pkl
    model-training:
        needs: data-processing
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v3
        -   name: Setup Python
            uses: actions/setup-python@v4
            with:
                python-version: '3.11.15'
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
        -   name: Download processed data
            uses: actions/download-artifact@v4
            with:
                name: processed-data
                path: data/processed
        -   name: MLflow setup
            run: |
                docker run -d -p 5555:5000 --name mlflow ghcr.io/mlflow/mlflow:latest \
                  mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db \
                  --default-artifact-root /tmp/mlruns
        -   name: Wait for MLflow to be ready
            run: |
                for i in {1..10}; do
                    curl -s http://localhost:5555/health || sleep 5
                done
        -   name: Train model
            run: |    
                python src/models/train_model.py --config configs/model_config.yaml --data data/processed/featured_house_data.csv --models-dir models --mlflow-tracking-uri http://localhost:5555
        -   name: Cleaning mlflow
            run: |
                docker stop mlflow
                docker rm mlflow
        -   name: Upload trained model
            uses: actions/upload-artifact@v4
            with:
                name: trained-model
                path: models/trained
        
    package-and-publish:
        needs: model-training
        runs-on: ubuntu-latest
        steps:
        -   name: Download trained model
            uses: actions/download-artifact@v4
            with:
                name: trained-model
                path: models/trained
        -   name: Download preprocessor
            uses: actions/download-artifact@v4
            with:
                name: preprocessor
                path: models/trained
        -   name: Login to Dockerhub
            uses: docker/login-action@v3
            with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
        -   name: setup Docker Buildx
            uses: docker/setup-buildx-action@v3
        -   name: Build and push Docker image
            run: |
                COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
                docker build -t docker.io/${{ vars.DOCKERHUB_USERNAME }}/fastapi:${COMMIT_HASH} -f Dockerfile .
                docker run -d -p 8000:8000 --name fastapi docker.io/${{ vars.DOCKERHUB_USERNAME }}/fastapi:${COMMIT_HASH} --name test-api
                for i in {1..10}; do
                    curl -s http://localhost:8000/health || sleep 5
                done
                docker logs test-api
        -   name: Stop and remove Docker container
            run: |
                docker stop test-api
                docker rm test-api
        -   name: Login to Github container registry
            uses: docker/login-action@v3
            with:
                registry: docker.io
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
        -   name: Push image to Github container registry
            run: |
                COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
                docker tag docker.io/${{ vars.DOCKERHUB_USERNAME }}/fastapi:${COMMIT_HASH} docker.io/${{ vars.DOCKERHUB_USERNAME }}/fastapi:latest
                docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/fastapi:${COMMIT_HASH}
                docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/fastapi:latest

